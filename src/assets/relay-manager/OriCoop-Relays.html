<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="pageTitle"></title>
  <style>
    /* --- Ori Forest Theme Palette (ori-palette.md) --- */
    :root {
      --bg-navy: #07131F;
      --deep-teal: #0C2935;
      --moonlit-blue: #164B70;
      --primary-ivory: #DDEAE5;
      --selected-white: #F1FCFF;
      --secondary-text: #8AA7AB;
      --cyan-glow: #91DFF4;
      --signal-motes: #63DDE8;
      --moss-accent: #617747;
      --controller-a: #91C95B;
      --controller-b: #D76659;
      --scrim-black: #02080E;
      --panel-bg: rgba(12, 41, 53, 0.58);
      --panel-border: rgba(145, 223, 244, 0.22);
      --panel-glow: rgba(145, 223, 244, 0.08);
      --font-serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", "STSong", "Cormorant Garamond", Georgia, serif;
      --font-mono: ui-monospace, "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      background-color: var(--bg-navy);
      background-image:
        radial-gradient(ellipse 900px 550px at 50% 12%, rgba(22, 75, 112, 0.45) 0%, rgba(12, 41, 53, 0.38) 50%, transparent 85%),
        radial-gradient(circle 500px at 85% 75%, rgba(99, 221, 232, 0.08) 0%, transparent 60%),
        radial-gradient(circle 420px at 15% 80%, rgba(97, 119, 71, 0.12) 0%, transparent 65%),
        linear-gradient(180deg, #07131F 0%, #040B12 100%);
      background-attachment: fixed;
      color: var(--primary-ivory);
      font-family: var(--font-serif);
      min-height: 100vh;
      line-height: 1.5;
      position: relative;
    }

    /* Ambient Forest Motes Background Animation */
    .mote-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .mote {
      position: absolute;
      width: 3px;
      height: 3px;
      background: var(--signal-motes);
      border-radius: 50%;
      box-shadow: 0 0 8px 2px var(--cyan-glow);
      opacity: 0.3;
      animation: floatMote 15s infinite ease-in-out;
    }

    .mote:nth-child(1) { top: 18%; left: 12%; animation-duration: 18s; animation-delay: 0s; }
    .mote:nth-child(2) { top: 62%; left: 84%; animation-duration: 14s; animation-delay: -3s; }
    .mote:nth-child(3) { top: 38%; left: 72%; animation-duration: 22s; animation-delay: -7s; }
    .mote:nth-child(4) { top: 76%; left: 22%; animation-duration: 16s; animation-delay: -5s; }
    .mote:nth-child(5) { top: 88%; left: 52%; animation-duration: 20s; animation-delay: -11s; }

    @keyframes floatMote {
      0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.2; }
      50% { transform: translateY(-30px) scale(1.3); opacity: 0.65; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 18px 48px 18px;
    }

    /* Header & Titles */
    header {
      text-align: center;
      margin-bottom: 26px;
    }

    .language-switch {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--secondary-text);
    }

    .language-switch button {
      padding: 2px 4px;
      font-size: 12px;
      background: transparent;
      border-color: transparent;
      color: var(--secondary-text);
      box-shadow: none;
    }

    .language-switch button[aria-pressed="true"] {
      color: var(--cyan-glow);
      text-decoration: underline;
    }

    .title-banner {
      display: inline-block;
      position: relative;
    }

    h1 {
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 2px;
      color: var(--selected-white);
      text-shadow: 0 0 16px rgba(145, 223, 244, 0.45), 0 2px 4px var(--scrim-black);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--secondary-text);
      letter-spacing: 1px;
      text-shadow: 0 1px 3px var(--scrim-black);
    }

    .sep {
      color: rgba(138, 167, 171, 0.55);
      margin: 0 4px;
      font-size: 0.9em;
    }

    .en-sub {
      font-size: 0.85em;
      color: var(--secondary-text);
    }

    /* General Panel Glass */
    .panel {
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(2, 8, 14, 0.65), 0 0 16px var(--panel-glow), inset 0 1px 0 rgba(221, 234, 229, 0.12);
      padding: 20px 22px;
      margin-bottom: 20px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .panel:hover {
      border-color: rgba(145, 223, 244, 0.35);
    }

    /* Connection & Status Bar */
    .file-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--primary-ivory);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #50616b;
      transition: all 0.3s ease;
    }

    .status-dot.connected {
      background: var(--signal-motes);
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    .status-save-time {
      color: var(--cyan-glow);
      font-size: 13px;
      font-family: var(--font-mono);
      margin-left: 8px;
      text-shadow: 0 0 8px rgba(145, 223, 244, 0.3);
    }

    .file-bar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .path-guide-box {
      background: rgba(7, 19, 31, 0.72);
      border: 1px solid rgba(138, 167, 171, 0.25);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--secondary-text);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .path-code {
      font-family: var(--font-mono);
      color: var(--cyan-glow);
      background: rgba(22, 75, 112, 0.35);
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid rgba(145, 223, 244, 0.25);
    }

    /* Buttons */
    button {
      font-family: var(--font-serif);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      padding: 8px 15px;
      outline: none;
      white-space: nowrap;
    }

    button:focus-visible {
      outline: 2px solid var(--cyan-glow);
      outline-offset: 2px;
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(22, 75, 112, 0.85) 0%, rgba(12, 41, 53, 0.95) 100%);
      border: 1px solid rgba(145, 223, 244, 0.4);
      color: var(--selected-white);
      box-shadow: 0 4px 12px rgba(2, 8, 14, 0.5);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, rgba(30, 95, 140, 0.95) 0%, rgba(16, 55, 72, 1) 100%);
      border-color: var(--cyan-glow);
      box-shadow: 0 0 14px rgba(145, 223, 244, 0.45);
      color: #fff;
    }

    .btn-secondary {
      background: rgba(12, 41, 53, 0.65);
      border: 1px solid rgba(138, 167, 171, 0.35);
      color: var(--primary-ivory);
    }

    .btn-secondary:hover {
      border-color: var(--cyan-glow);
      color: var(--selected-white);
      box-shadow: 0 0 10px rgba(145, 223, 244, 0.25);
    }

    .btn-danger {
      background: rgba(215, 102, 89, 0.1);
      border: 1px solid rgba(215, 102, 89, 0.35);
      color: var(--controller-b);
      padding: 5px 12px;
      font-size: 13px;
    }

    .btn-danger:hover {
      background: rgba(215, 102, 89, 0.25);
      border-color: var(--controller-b);
      box-shadow: 0 0 10px rgba(215, 102, 89, 0.35);
    }

    .btn-success {
      background: rgba(145, 201, 91, 0.15);
      border: 1px solid rgba(145, 201, 91, 0.45);
      color: var(--controller-a);
      padding: 5px 10px;
      font-size: 12px;
    }

    .btn-success:hover {
      background: rgba(145, 201, 91, 0.3);
      box-shadow: 0 0 10px rgba(145, 201, 91, 0.4);
    }

    /* Paste Area */
    .paste-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 400;
      color: var(--selected-white);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--cyan-glow);
      border-radius: 2px;
      box-shadow: 0 0 6px var(--cyan-glow);
    }

    .paste-row {
      display: flex;
      gap: 10px;
    }

    .input-text {
      flex: 1;
      background: rgba(7, 19, 31, 0.72);
      border: 1px solid rgba(138, 167, 171, 0.35);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--primary-ivory);
      font-family: var(--font-mono);
      font-size: 14px;
      transition: all 0.2s ease;
      outline: none;
    }

    .input-text:focus {
      border-color: var(--cyan-glow);
      box-shadow: 0 0 12px rgba(145, 223, 244, 0.35);
      background: rgba(7, 19, 31, 0.9);
      color: var(--selected-white);
    }

    .input-text::placeholder {
      color: rgba(138, 167, 171, 0.5);
      font-family: var(--font-serif);
    }

    /* Alert / Feedback Messages */
    .alert-box {
      display: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.4;
      animation: fadeIn 0.2s ease;
    }

    .alert-box.visible {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .alert-error {
      background: rgba(215, 102, 89, 0.16);
      border: 1px solid rgba(215, 102, 89, 0.45);
      color: #ff9d93;
    }

    .alert-info {
      background: rgba(99, 221, 232, 0.12);
      border: 1px solid rgba(99, 221, 232, 0.4);
      color: var(--cyan-glow);
    }

    .room-code-tag {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 2px;
      background: rgba(22, 75, 112, 0.6);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--cyan-glow);
      color: var(--selected-white);
      margin: 0 4px;
    }

    /* Relay List */
    .list-header {
      display: grid;
      grid-template-columns: 85px 1fr 200px 115px;
      padding: 10px 16px;
      font-size: 13px;
      color: var(--secondary-text);
      border-bottom: 1px solid rgba(138, 167, 171, 0.2);
      margin-bottom: 8px;
    }

    .relay-item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 40px;
    }

    .relay-row {
      display: grid;
      grid-template-columns: 85px 1fr 200px 115px;
      align-items: center;
      padding: 10px 16px;
      background: rgba(7, 19, 31, 0.45);
      border: 1px solid rgba(138, 167, 171, 0.15);
      border-radius: 8px;
      transition: all 0.2s ease;
      position: relative;
    }

    .relay-row:hover {
      background: rgba(12, 41, 53, 0.5);
      border-color: rgba(145, 223, 244, 0.28);
    }

    .relay-row.active {
      background: linear-gradient(90deg, rgba(99, 221, 232, 0.16) 0%, rgba(22, 75, 112, 0.26) 50%, rgba(12, 41, 53, 0.16) 100%);
      border: 1px solid rgba(145, 223, 244, 0.55);
      box-shadow: 0 0 16px rgba(99, 221, 232, 0.2), inset 0 0 8px rgba(99, 221, 232, 0.08);
    }

    .relay-row.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10%;
      bottom: 10%;
      width: 3px;
      background: var(--cyan-glow);
      border-radius: 0 2px 2px 0;
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    /* Radio button custom look */
    .radio-col {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .radio-col input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--secondary-text);
      border-radius: 50%;
      background: rgba(7, 19, 31, 0.7);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      outline: none;
    }

    .radio-col input[type="radio"]:focus-visible {
      outline: 2px solid var(--cyan-glow);
      outline-offset: 2px;
    }

    .radio-col input[type="radio"]:checked {
      border-color: var(--cyan-glow);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    .radio-col input[type="radio"]:checked::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan-glow);
      box-shadow: 0 0 6px var(--signal-motes);
    }

    .radio-label {
      font-size: 13px;
      color: var(--secondary-text);
      user-select: none;
    }

    .relay-row.active .radio-label {
      color: var(--cyan-glow);
      font-weight: 500;
    }

    .name-col {
      padding-right: 12px;
    }

    .name-input {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 6px 8px;
      color: var(--primary-ivory);
      font-family: var(--font-serif);
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .name-input:hover {
      border-color: rgba(138, 167, 171, 0.25);
      background: rgba(7, 19, 31, 0.3);
    }

    .name-input:focus {
      border-color: var(--cyan-glow);
      background: rgba(7, 19, 31, 0.75);
      box-shadow: 0 0 8px rgba(145, 223, 244, 0.25);
      color: var(--selected-white);
      outline: none;
    }

    .name-input::placeholder {
      color: rgba(138, 167, 171, 0.4);
      font-style: italic;
    }

    .addr-col {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--secondary-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 12px;
    }

    .relay-row.active .addr-col {
      color: var(--selected-white);
      text-shadow: 0 0 6px rgba(145, 223, 244, 0.25);
    }

    .actions-col {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .delete-confirm-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .confirm-btn-yes {
      background: rgba(215, 102, 89, 0.25);
      border: 1px solid var(--controller-b);
      color: var(--controller-b);
      padding: 4px 8px;
      font-size: 12px;
    }

    .confirm-btn-no {
      background: rgba(12, 41, 53, 0.6);
      border: 1px solid rgba(138, 167, 171, 0.35);
      color: var(--secondary-text);
      padding: 4px 8px;
      font-size: 12px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 30px 10px;
      color: var(--secondary-text);
      font-size: 14px;
      font-style: italic;
    }

    /* Playtime Note */
    .playtime-note {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 18px;
      background: rgba(7, 19, 31, 0.52);
      border-left: 3px solid var(--moss-accent);
      border-radius: 0 8px 8px 0;
      color: var(--secondary-text);
      font-size: 13px;
      line-height: 1.6;
      margin-top: 14px;
    }

    .note-icon {
      color: var(--controller-a);
      font-size: 16px;
      line-height: 1;
      margin-top: 2px;
    }

    /* Fallback Area */
    .fallback-section {
      display: none;
      border-top: 1px dashed rgba(145, 223, 244, 0.25);
      padding-top: 18px;
      margin-top: 18px;
    }

    .fallback-section.visible {
      display: block;
    }

    .fallback-desc {
      font-size: 13px;
      color: #e0b471;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .fallback-textarea {
      width: 100%;
      height: 110px;
      background: rgba(7, 19, 31, 0.85);
      border: 1px solid rgba(138, 167, 171, 0.3);
      border-radius: 6px;
      color: var(--primary-ivory);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 10px 12px;
      resize: vertical;
      margin-bottom: 12px;
      outline: none;
    }

    .fallback-textarea:focus {
      border-color: var(--cyan-glow);
    }

    .fallback-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      pointer-events: none;
    }

    .toast {
      background: rgba(12, 41, 53, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--cyan-glow);
      box-shadow: 0 8px 24px rgba(2, 8, 14, 0.8), 0 0 12px rgba(145, 223, 244, 0.3);
      border-radius: 8px;
      padding: 12px 20px;
      color: var(--selected-white);
      font-size: 14px;
      margin-top: 10px;
      opacity: 0;
      transform: translateY(16px);
      transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive Adjustments */
    @media (max-width: 680px) {
      .list-header {
        display: none;
      }
      .relay-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .actions-col {
        justify-content: flex-start;
      }
      .paste-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient Motes Background -->
  <div class="mote-bg" aria-hidden="true">
    <div class="mote"></div>
    <div class="mote"></div>
    <div class="mote"></div>
    <div class="mote"></div>
    <div class="mote"></div>
  </div>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="language-switch">
        <button type="button" data-lang="zh" data-i18n="languageZh"></button>
        <span aria-hidden="true">|</span>
        <button type="button" data-lang="en" data-i18n="languageEn"></button>
      </div>
      <div class="title-banner">
        <h1 data-i18n="heading"></h1>
        <p class="subtitle" data-i18n="subtitle"></p>
      </div>
    </header>

    <!-- File Connection Panel -->
    <section class="panel" data-i18n-aria-label="filePanelLabel">
      <div class="file-bar">
        <div class="file-bar-header">
          <div class="status-indicator">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText"><span data-i18n="disconnected"></span></span>
            <span class="status-save-time" id="saveTimeLabel"></span>
          </div>
          <div class="file-bar-actions">
            <button type="button" class="btn-primary" id="btnOpenFile" data-i18n="openFile"></button>
            <button type="button" class="btn-secondary" id="btnReconnect" style="display: none;" data-i18n="reconnect"></button>
          </div>
        </div>

        <div class="path-guide-box">
          <span><span data-i18n="filePath"></span></span>
          <span class="path-code"><span data-i18n="pathGuide"></span></span>
        </div>
      </div>
    </section>

    <!-- Paste & Add Panel -->
    <section class="panel" data-i18n-aria-label="addPanelLabel">
      <div class="paste-section">
        <h2 class="section-title" data-i18n="addRelay"></h2>
        <div class="paste-row">
          <input type="text" id="pasteInput" class="input-text"
                 data-i18n-placeholder="pastePlaceholder"
                 data-i18n-aria-label="relayAddressLabel" spellcheck="false" autocomplete="off" />
          <button type="button" class="btn-primary" id="btnPasteAdd" data-i18n="pasteAdd"></button>
        </div>

        <!-- Room Code Info Display -->
        <div class="alert-box alert-info" id="roomCodeBox" role="status">
          <span id="roomCodeMsg"></span>
          <button type="button" class="btn-success" id="btnCopyRoomCode" data-i18n="copyRoomCode"></button>
        </div>

        <!-- Validation Error Display -->
        <div class="alert-box alert-error" id="errorBox" role="alert">
          <span id="errorMsg"></span>
        </div>
      </div>
    </section>

    <!-- Relay List Panel -->
    <section class="panel" data-i18n-aria-label="listPanelLabel">
      <h2 class="section-title" style="margin-bottom: 12px;" data-i18n="relayList"></h2>

      <div class="list-header" aria-hidden="true">
        <div><span data-i18n="active"></span></div>
        <div><span data-i18n="name"></span></div>
        <div><span data-i18n="address"></span></div>
        <div style="text-align: right;"><span data-i18n="action"></span></div>
      </div>

    /* =====================================================================
       Pure Functions: Parser, Serializer, Link & Validator
       ===================================================================== */

    function parseConfigFile(content) {
      if (typeof content !== "string") return [];
      const lines = content.split(/\r?\n/);
      const entries = [];
      let foundSelected = false;

      for (let rawLine of lines) {
        const line = rawLine;
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith("#")) {
          continue;
        }

        const isSelected = line.startsWith("*");
        const rest = isSelected ? line.slice(1) : line;
        const tabIdx = rest.indexOf("\t");

        let name = "";
        let addr = "";

        if (tabIdx === -1) {
          addr = rest.trim();
        } else {
          name = rest.slice(0, tabIdx).replace(/[\t\r\n]/g, "");
          addr = rest.slice(tabIdx + 1).trim();
        }

        let host = "";
        let port = DEFAULT_PORT;

        const lastColon = addr.lastIndexOf(":");
        const closeBracket = addr.lastIndexOf("]");
        if (lastColon > closeBracket && lastColon !== -1) {
          host = addr.slice(0, lastColon).trim();
          const p = parseInt(addr.slice(lastColon + 1), 10);
          if (!isNaN(p) && p >= 1 && p <= 65535) {
            port = p;
          }
        } else {
          host = addr.trim();
        }

        if (host && !/\s/.test(host)) {
          const selected = isSelected && !foundSelected;
          if (selected) foundSelected = true;
          entries.push({ name, host, port, selected });
        }
      }
      return entries;
    }

    function serializeConfigFile(entries) {
      const lines = [CONFIG_HEADER];
      let foundSelected = false;
      for (const entry of entries) {
        const isSel = entry.selected && !foundSelected;
        if (isSel) foundSelected = true;
        const cleanName = (entry.name || "").replace(/[\t\r\n]/g, "");
        const cleanHost = (entry.host || "").trim();
        const port = entry.port || DEFAULT_PORT;
        lines.push((isSel ? "*" : "") + cleanName + "\t" + cleanHost + ":" + port);
      }
      return lines.join("\n") + "\n";
    }

    // Empty list prompt: before a config file has been read the first step is to
    // open it (the config path is shown above). Without the File System Access
    // API there is nothing to open, so the fallback/import hint is kept.
    function emptyListKey(fileReady, canUseFileApi) {
      if (!canUseFileApi) return "emptyList";
      return fileReady ? "emptyList" : "emptyListOpenFirst";
    }

    function parseLinkOrAddress(input) {
      let str = (input || "").trim();
      if (!str) {
        throw Object.assign(new Error(t("inputEmpty")), { i18nKey: "inputEmpty" });
      }

      // Pre-check for spaces in host part (before ? query parameters)
      const mainPart = str.split("?")[0];
      if (/\s/.test(mainPart)) {
        throw Object.assign(new Error(t("hostSpaces")), { i18nKey: "hostSpaces" });
      }

      // Check port validity in mainPart before new URL to provide clear port error
      const lastColon = mainPart.lastIndexOf(":");
      const lastBracket = mainPart.lastIndexOf("]");
      if (lastColon > lastBracket && lastColon !== -1) {
        const afterColon = mainPart.slice(lastColon + 1);
        const slashIdx = afterColon.indexOf("/");
        const portCandidate = slashIdx !== -1 ? afterColon.slice(0, slashIdx) : afterColon;
        if (portCandidate) {
          const p = Number(portCandidate);
          if (!Number.isInteger(p) || p < 1 || p > 65535) {
            throw Object.assign(new Error(t("portRange")), { i18nKey: "portRange" });
          }
        }
      }

      let name = "";
      let roomCode = null;
      let urlObj;

      try {
        if (str.includes("://")) {
          urlObj = new URL(str);
          if (urlObj.protocol.toLowerCase() !== "oricoop:") {
            throw Object.assign(new Error(t("unsupportedProtocol")), { i18nKey: "unsupportedProtocol" });
          }
        } else {
          urlObj = new URL("oricoop://" + str);
        }
      } catch (err) {
        if (err.i18nKey) {
          throw err;
        }
        throw Object.assign(new Error(t("invalidAddress")), { i18nKey: "invalidAddress" });
      }

      const queryName = urlObj.searchParams.get("name");
      if (queryName !== null) {
        name = queryName.replace(/[\t\r\n]/g, "").trim();
      }

      const cleanPath = urlObj.pathname.replace(/^\/+|\/+$/g, "");
      if (cleanPath) {
        const codeMatch = cleanPath.match(/^([A-HJ-NP-Z2-9]{6})$/i);
        if (codeMatch) {
          roomCode = codeMatch[1].toUpperCase();
        }
      }

      let host = urlObj.hostname;
      let portStr = urlObj.port;

      if (!host) {
        throw Object.assign(new Error(t("hostEmpty")), { i18nKey: "hostEmpty" });
      }
      if (/\s/.test(host)) {
        throw Object.assign(new Error(t("hostSpaces")), { i18nKey: "hostSpaces" });
      }

      let port = DEFAULT_PORT;
      if (portStr) {
        const p = Number(portStr);
        if (!Number.isInteger(p) || p < 1 || p > 65535) {
          throw Object.assign(new Error(t("portRange")), { i18nKey: "portRange" });
        }
        port = p;
      }

      return { host, port, name, roomCode };
    }

    /* =====================================================================
       Self Test: window.__selfTest()
       ===================================================================== */

    function __selfTest() {
      // 1. Parsing & serializing example entries
      const sample1 = [
        CONFIG_HEADER,
        "*My VPS\t203.0.113.5:47020",
        "Friend's server\trelay.example.com:47020"
      ].join("\n") + "\n";

      const parsed1 = parseConfigFile(sample1);
      if (parsed1.length !== 2) throw new Error("SelfTest 1: expected 2 entries");
      if (!parsed1[0].selected || parsed1[0].name !== "My VPS" || parsed1[0].host !== "203.0.113.5" || parsed1[0].port !== 47020) {
        throw new Error("SelfTest 1: entry 0 mismatch");
      }
      if (parsed1[1].selected || parsed1[1].name !== "Friend's server" || parsed1[1].host !== "relay.example.com" || parsed1[1].port !== 47020) {
        throw new Error("SelfTest 1: entry 1 mismatch");
      }

      const serialized1 = serializeConfigFile(parsed1);
      if (serialized1 !== sample1) {
        throw new Error("SelfTest 1: round-trip serialization failed");
      }

      // 2. Empty names
      const sample2 = [
        CONFIG_HEADER,
        "*\t203.0.113.5:47020",
        "\trelay.example.com:47020"
      ].join("\n") + "\n";
      const parsed2 = parseConfigFile(sample2);
      if (parsed2.length !== 2 || parsed2[0].name !== "" || parsed2[1].name !== "") {
        throw new Error("SelfTest 2: empty names failed");
      }
      if (serializeConfigFile(parsed2) !== sample2) {
        throw new Error("SelfTest 2: empty names round-trip failed");
      }

      // 3. Tab and newline stripping in names
      const dirty = [{ name: "Bad\tName\r\nTest", host: "1.1.1.1", port: 47020, selected: true }];
      const sDirty = serializeConfigFile(dirty);
      if (sDirty.includes("\tName")) throw new Error("SelfTest 3: tab stripping failed");
      const pDirty = parseConfigFile(sDirty);
      if (pDirty[0].name !== "BadNameTest") throw new Error("SelfTest 3: parsed name mismatch");

      // 4. oricoop:// variants
      const u1 = parseLinkOrAddress("oricoop://203.0.113.5:47020");
      if (u1.host !== "203.0.113.5" || u1.port !== 47020 || u1.roomCode !== null) throw new Error("SelfTest 4a failed");

      const u2 = parseLinkOrAddress("oricoop://203.0.113.5:47020/ABCDEF");
      if (u2.host !== "203.0.113.5" || u2.port !== 47020 || u2.roomCode !== "ABCDEF") throw new Error("SelfTest 4b failed");

      const u3 = parseLinkOrAddress("oricoop://relay.example.com:47020?name=My%20Server");
      if (u3.host !== "relay.example.com" || u3.port !== 47020 || u3.name !== "My Server") throw new Error("SelfTest 4c failed");

      const u4 = parseLinkOrAddress("oricoop://relay.example.com:47020/H7K2M9?name=Official%20Relay");
      if (u4.host !== "relay.example.com" || u4.port !== 47020 || u4.roomCode !== "H7K2M9" || u4.name !== "Official Relay") throw new Error("SelfTest 4d failed");

      const u5 = parseLinkOrAddress("oricoop://relay.example.com");
      if (u5.host !== "relay.example.com" || u5.port !== 47020) throw new Error("SelfTest 4e failed");

      const u6 = parseLinkOrAddress("203.0.113.5:47020");
      if (u6.host !== "203.0.113.5" || u6.port !== 47020) throw new Error("SelfTest 4f failed");

      const u7 = parseLinkOrAddress("relay.example.com");
      if (u7.host !== "relay.example.com" || u7.port !== 47020) throw new Error("SelfTest 4g failed");

      // 5. Validation errors
      let threw = false;
      try { parseLinkOrAddress("relay.example.com:0"); } catch(e) { threw = true; }
      if (!threw) throw new Error("SelfTest 5a: port 0 must throw");

      threw = false;
      try { parseLinkOrAddress("relay.example.com:70000"); } catch(e) { threw = true; }
      if (!threw) throw new Error("SelfTest 5b: port 70000 must throw");

      threw = false;
      try { parseLinkOrAddress("relay server.com:47020"); } catch(e) { threw = true; }
      if (!threw) throw new Error("SelfTest 5c: host with spaces must throw");

      // 6. Empty-list prompt: ask to open the config file until one was read
      if (emptyListKey(false, true) !== "emptyListOpenFirst") throw new Error("SelfTest 6a: missing open-file prompt");
      if (emptyListKey(true, true) !== "emptyList") throw new Error("SelfTest 6b: loaded file must offer to add");
      if (emptyListKey(false, false) !== "emptyList") throw new Error("SelfTest 6c: fallback must offer to add");
      for (const lang of ["zh", "en"]) {
        if (!I18N[lang] || !I18N[lang].emptyListOpenFirst) {
          throw new Error("SelfTest 6d: emptyListOpenFirst missing in " + lang);
        }
      }

      return true;
    }

    if (typeof window !== "undefined") {
      window.__selfTest = __selfTest;
    }

    /* =====================================================================
       IndexedDB Helper
       ===================================================================== */

    function openIDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error(t("idbUnsupported")));
          return;
        }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveHandleToIDB(handle) {
      try {
        const db = await openIDB();
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(handle, HANDLE_KEY);
        return new Promise((resolve, reject) => {
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      } catch (err) {
        console.warn("Could not save handle to IndexedDB:", err);
      }
    }

    async function getHandleFromIDB() {
      try {
        const db = await openIDB();
        const tx = db.transaction(STORE_NAME, "readonly");
        const req = tx.objectStore(STORE_NAME).get(HANDLE_KEY);
        return new Promise((resolve, reject) => {
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      } catch (err) {
        console.warn("Could not retrieve handle from IndexedDB:", err);
        return null;
      }
    }

    /* =====================================================================
       File I/O & Live Synchronization
       ===================================================================== */

    function formatTime(date) {
      const pad = (n) => String(n).padStart(2, "0");
      return pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds());
    }

    function updateSaveTimestamp() {
      const nowStr = formatTime(new Date());
      localize(saveTimeLabel, "savedAt", nowStr);
    }

    function setConnectionStatus(connected, filename = "") {
      if (connected) {
        statusDot.className = "status-dot connected";
        localize(statusText, "connected", filename || "oricoop-relays.txt");
      } else {
        statusDot.className = "status-dot";
        localize(statusText, "disconnected");
      }
    }

    async function loadFromFile(handle) {
      try {
        const file = await handle.getFile();
        const text = await file.text();
        lastFileText = text;
        relays = parseConfigFile(text);
        fileReady = true;
        renderRelayList();
        setConnectionStatus(true, file.name);
        btnReconnect.style.display = "none";
        updateSaveTimestamp();
        showToast("fileLoaded", "success");
      } catch (err) {
        console.error("Load file error:", err);
        fileReady = false;
        renderRelayList();
        showToast("readFailed", "error", err.message);
      }
    }

    async function writeToFile() {
      const text = serializeConfigFile(relays);
      lastFileText = text;

      // Update fallback textarea if present
      if (fallbackTextarea) {
        fallbackTextarea.value = text;
      }

      if (!fileHandle) {
        // Nothing was written: say so instead of "Saved".
        localize(saveTimeLabel, fallbackTextarea ? "downloadToSave" : "openToSave");
        return;
      }

      try {
        isWriting = true;
        const writable = await fileHandle.createWritable();
        await writable.write(text);
        await writable.close();
        isWriting = false;
        updateSaveTimestamp();
      } catch (err) {
        isWriting = false;
        console.error("Write error:", err);
        showToast("writeFailed", "error", err.message);
      }
    }

    // Live re-read every 2000 ms
    setInterval(async () => {
      if (!fileHandle || isWriting) return;

      // Don't refresh if user is currently typing in an input or textarea
      const activeEl = document.activeElement;
      const isTyping = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA");
      if (isTyping) return;

      try {
        const file = await fileHandle.getFile();
        const text = await file.text();
        if (text !== lastFileText) {
          lastFileText = text;
          relays = parseConfigFile(text);
          renderRelayList();
          updateSaveTimestamp();
          showToast("refreshed", "info");
        }
      } catch (err) {
        // Disk or permission error
      }
    }, 2000);

    /* =====================================================================
       UI Actions: Add, Edit, Delete, Select
       ===================================================================== */

    function showError(key, ...args) {
      if (!key) {
        errorBox.classList.remove("visible");
        errorMsg.textContent = "";
        delete errorMsg.dataset.i18n;
      } else {
        localize(errorMsg, key, ...args);
        errorBox.classList.add("visible");
      }
    }

    function showRoomCode(code) {
      if (!code) {
        roomCodeBox.classList.remove("visible");
        currentRoomCode = null;
      } else {
        currentRoomCode = code;
        roomCodeMsg.replaceChildren();
        const label = document.createElement("span");
        localize(label, "roomCode");
        const tag = document.createElement("span");
        tag.className = "room-code-tag";
        tag.textContent = code;
        const hint = document.createElement("span");
        localize(hint, "roomCodeHint");
        roomCodeMsg.append(label, tag, hint);
        roomCodeBox.classList.add("visible");
      }
    }

    function showToast(key, type = "info", ...args) {
      const toast = document.createElement("div");
      toast.className = "toast";
      localize(toast, key, ...args);
      if (type === "error") {
        toast.style.borderColor = "var(--controller-b)";
      } else if (type === "success") {
        toast.style.borderColor = "var(--controller-a)";
      }
      toastContainer.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add("show");
      });

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
      }, 2600);
    }

    async function handleAddRelay(rawInput) {
      showError(null);
      try {
        const parsed = parseLinkOrAddress(rawInput);

        if (parsed.roomCode) {
          showRoomCode(parsed.roomCode);
        }

        // Check if address already exists in list (matching host & port)
        const existingIdx = relays.findIndex(
          (r) => r.host.toLowerCase() === parsed.host.toLowerCase() && r.port === parsed.port
        );

        if (existingIdx !== -1) {
          // Select existing entry
          relays.forEach((r, idx) => {
            r.selected = idx === existingIdx;
          });
          if (parsed.name && !relays[existingIdx].name) {
            relays[existingIdx].name = parsed.name;
          }
          await writeToFile();
          renderRelayList();
          showToast("relayExists", "info");
        } else {
          // Add new entry and select it
          relays.forEach((r) => { r.selected = false; });
          relays.push({
            name: parsed.name,
            host: parsed.host,
            port: parsed.port,
            selected: true
          });
          await writeToFile();
          renderRelayList();
          showToast("relayAdded", "success");
        }

        pasteInput.value = "";
      } catch (err) {
        showError(err.i18nKey || "errorDetail", ...(err.i18nKey ? [] : [err.message]));
        pasteInput.focus();
        pasteInput.select();
      }
    }

    function renderRelayList() {
      relayList.innerHTML = "";

      if (relays.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        localize(empty, emptyListKey(fileReady, !!window.showOpenFilePicker));
        relayList.appendChild(empty);
        return;
      }

      relays.forEach((entry, idx) => {
        const row = document.createElement("div");
        row.className = "relay-row" + (entry.selected ? " active" : "");

        // Column 1: Radio Selection
        const radioCol = document.createElement("label");
        radioCol.className = "radio-col";
        localizeAttribute(radioCol, "title", "selectRelayTitle");

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "activeRelayRadio";
        radio.checked = !!entry.selected;
        localizeAttribute(radio, "aria-label", "selectRelayLabel", (entry.name || entry.host));

        radio.addEventListener("change", async () => {
          relays.forEach((r, i) => { r.selected = i === idx; });
          await writeToFile();
          renderRelayList();
          showToast("relaySwitched", "info");
        });

        const radioLabel = document.createElement("span");
        radioLabel.className = "radio-label";
        localize(radioLabel, entry.selected ? "active" : "select");

        radioCol.appendChild(radio);
        radioCol.appendChild(radioLabel);
        row.appendChild(radioCol);

        // Column 2: Editable Name
        const nameCol = document.createElement("div");
        nameCol.className = "name-col";

        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.className = "name-input";
        nameInput.value = entry.name || "";
        localizeAttribute(nameInput, "placeholder", "namePlaceholder");
        localizeAttribute(nameInput, "aria-label", "relayNameLabel");

        // Save on change or blur
        const saveNameChange = async () => {
          const clean = nameInput.value.replace(/[\t\r\n]/g, "").trim();
          if (clean !== (entry.name || "")) {
            entry.name = clean;
            await writeToFile();
          }
        };

        nameInput.addEventListener("change", saveNameChange);
        nameInput.addEventListener("blur", saveNameChange);
        nameInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            nameInput.blur();
          }
        });

        nameCol.appendChild(nameInput);
        row.appendChild(nameCol);

        // Column 3: Monospace Address
        const addrCol = document.createElement("div");
        addrCol.className = "addr-col";
        addrCol.textContent = entry.host + ":" + entry.port;
        addrCol.title = entry.host + ":" + entry.port;
        row.appendChild(addrCol);

        // Column 4: Delete with Confirmation
        const actionsCol = document.createElement("div");
        actionsCol.className = "actions-col";

        const btnDelete = document.createElement("button");
        btnDelete.type = "button";
        btnDelete.className = "btn-danger";
        localize(btnDelete, "delete");
        localizeAttribute(btnDelete, "aria-label", "deleteRelayLabel");

        btnDelete.addEventListener("click", () => {
          // Switch to inline confirmation
          actionsCol.innerHTML = "";

          const confirmGroup = document.createElement("div");
          confirmGroup.className = "delete-confirm-group";

          const btnYes = document.createElement("button");
          btnYes.type = "button";
          btnYes.className = "confirm-btn-yes";
          localize(btnYes, "confirmDelete");

          const btnNo = document.createElement("button");
          btnNo.type = "button";
          btnNo.className = "confirm-btn-no";
          localize(btnNo, "cancelDelete");

          btnYes.addEventListener("click", async () => {
            const wasSelected = entry.selected;
            relays.splice(idx, 1);
            if (wasSelected && relays.length > 0) {
              relays[0].selected = true;
            }
            await writeToFile();
            renderRelayList();
            showToast("relayDeleted", "info");
          });

          btnNo.addEventListener("click", () => {
            renderRelayList();
          });

          confirmGroup.appendChild(btnYes);
          confirmGroup.appendChild(btnNo);
          actionsCol.appendChild(confirmGroup);
          btnYes.focus();
        });

        actionsCol.appendChild(btnDelete);
        row.appendChild(actionsCol);

        relayList.appendChild(row);
      });

      // Update fallback textarea if visible
      if (fallbackTextarea) {
        fallbackTextarea.value = serializeConfigFile(relays);
      }
    }

    /* =====================================================================
       Event Handlers & Initialization
       ===================================================================== */

    // Paste & Add button
    btnPasteAdd.addEventListener("click", async () => {
      let text = "";
      if (navigator.clipboard && navigator.clipboard.readText) {
        try {
          text = await navigator.clipboard.readText();
        } catch (err) {
          // Clipboard permission denied or unavailable
        }
      }

      if (!text || !text.trim()) {
        text = pasteInput.value.trim();
      }

      if (!text) {
        showError("clipboardEmpty");
        pasteInput.focus();
        return;
      }

      await handleAddRelay(text);
    });

    // Enter key inside pasteInput
    pasteInput.addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const text = pasteInput.value.trim();
        if (text) {
          await handleAddRelay(text);
        } else {
          btnPasteAdd.click();
        }
      }
    });

    // Copy room code button
    btnCopyRoomCode.addEventListener("click", async () => {
      if (currentRoomCode) {
        try {
          await navigator.clipboard.writeText(currentRoomCode);
          showToast("roomCodeCopied", "success");
        } catch (e) {
          showToast("copyFailed", "error");
        }
      }
    });

    // Open Config File Button (File System Access API)
    btnOpenFile.addEventListener("click", async () => {
      if (!window.showOpenFilePicker) {
        showToast("fileApiUnsupported", "error");
        return;
      }
      try {
        const [handle] = await window.showOpenFilePicker({
          types: [{
            description: t("fileType"),
            accept: { "text/plain": [".txt"] }
          }],
          multiple: false
        });

        fileHandle = handle;
        await saveHandleToIDB(handle);
        await loadFromFile(handle);
      } catch (err) {
        if (err.name !== "AbortError") {
          console.error("Open file error:", err);
          showToast("openFailed", "error", err.message);
        }
      }
    });

    // Reconnect Button
    btnReconnect.addEventListener("click", async () => {
      const storedHandle = await getHandleFromIDB();
      if (!storedHandle) {
        btnReconnect.style.display = "none";
        return;
      }
      try {
        const perm = await storedHandle.requestPermission({ mode: "readwrite" });
        if (perm === "granted") {
          fileHandle = storedHandle;
          await loadFromFile(storedHandle);
        } else {
          showToast("permissionDenied", "error");
        }
      } catch (err) {
        console.error("Reconnect error:", err);
        showToast("reconnectFailed", "error", err.message);
        btnReconnect.style.display = "none";
      }
    });

    // Fallback: Download button
    btnDownload.addEventListener("click", () => {
      const text = serializeConfigFile(relays);
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "oricoop-relays.txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("fileDownloaded", "success");
    });

    // Fallback: Import file input
    importFileInput.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        relays = parseConfigFile(text);
        renderRelayList();
        showToast("configImported", "success", file.name);
      } catch (err) {
        showToast("importFailed", "error", err.message);
      }
      e.target.value = "";
    });

    // Page Load Initialization
    window.addEventListener("DOMContentLoaded", async () => {
      // Execute self test on startup
      try {
        __selfTest();
      } catch (testErr) {
        console.error("SelfTest failed:", testErr);
      }

      // Check File System Access API support
      if (!window.showOpenFilePicker) {
        fallbackArea.classList.add("visible");
        btnOpenFile.style.display = "none";
        btnReconnect.style.display = "none";
        localize(statusText, "fallbackMode");
        renderRelayList();
        return;
      }

      // Check if previous handle is stored in IndexedDB
      try {
        const storedHandle = await getHandleFromIDB();
        if (storedHandle) {
          let hasPermission = false;
          if (storedHandle.queryPermission) {
            const query = await storedHandle.queryPermission({ mode: "readwrite" });
            if (query === "granted") {
              hasPermission = true;
            }
          }
          if (hasPermission) {
            fileHandle = storedHandle;
            await loadFromFile(storedHandle);
          } else {
            btnReconnect.style.display = "inline-flex";
            renderRelayList();
          }
        } else {
          renderRelayList();
        }
      } catch (e) {
        console.warn("Init IDB check:", e);
        renderRelayList();
      }
    });
  </script>
</body>
</html>
